# Segundo prefix: Ctrl+w
set -g prefix2 C-w

# Recargar configuración (funciona con ambos prefixes)
bind r source-file ~/.tmux.conf \; display-message "¡Configuración recargada!"
bind -T prefix2 r source-file ~/.tmux.conf \; display-message "¡Configuración recargada!"

# Dividir paneles con Ctrl+w + s / v
# bind -T prefix2 s split-window -h     # vertical (izquierda/derecha)
# bind -T prefix2 v split-window -v     # horizontal (arriba/abajo)

